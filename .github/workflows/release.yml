name: Release

# Runs when release-plz pushes a version tag (and creates the GitHub release).
# Builds the wasm plugin, attests it (GitHub provenance, which
# `osc plugin install` verifies against the registry's `source_repo`) and
# uploads it with its sha256 to that release.
#
# Afterwards open a PR against gtema/openstack's plugins/registry/index.json
# with the download_url and sha256 printed in the job summary.

permissions: {}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

env:
  CARGO_TERM_COLOR: always
  WASM_NAME: s11auth_wasm_plugin.wasm

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Build, attest and upload
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Build wasm plugin
        run: cargo build --target wasm32-unknown-unknown --release --locked

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp "target/wasm32-unknown-unknown/release/${WASM_NAME}" dist/
          (cd dist && sha256sum "${WASM_NAME}" > "${WASM_NAME}.sha256")

      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.WASM_NAME }}

      # The release itself is created by release-plz.
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "${TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          {
            echo "### Registry entry"
            echo "- download_url: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${WASM_NAME}"
            echo "- sha256: $(cut -d' ' -f1 "dist/${WASM_NAME}.sha256")"
            echo "- source_repo: ${GITHUB_REPOSITORY}"
          } >> "$GITHUB_STEP_SUMMARY"
